[project]
name = "good-bad-board"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    { name = "Nathan Huynh", email = "nhanhuynh296@gmail.com" },
]
dependencies = ["faker>=36.1.1", "numpy>=2.2.3", "pydantic>=2.10.6", "black>=25.1.0"]
requires-python = "==3.13.*"
readme = "README.md"
license = { text = "MIT" }


[tool.pdm]
distribution = false

[tool.ruff]
line-length = 100

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    # Pyflakes
    "F",
    "W",
    # import sort
    "I",
    # mccabe code complexity
    "C90",
    # Perflint
    "PERF",
    # Some refactor https://docs.astral.sh/ruff/rules/#refactor-r
    "R",
    # flake8-simplify https://pypi.org/project/flake8_simplify/
    "SIM",
    # flake8-pytest-style
    "PT"
]
exclude = [
    # UI Component
    "src/oven_simulator/view/*",
    # ERD packet (for now)
    "src/oven_simulator/oven/models/packet/*",
]

[tool.ruff.lint.mccabe]
# Flag errors (`C901`) whenever the complexity level exceeds 10.
# Base on McCabe himself in his presentation
# http://www.mccabe.com/ppt/SoftwareQualityMetricsToIdentifyRisk.ppt
max-complexity = 10

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "pep257"